name: Build Android APK

# 云端构建德扑道场 Android 薄壳 APK，并发布到 Releases（固定标签 android-latest，永久直链）。
# 触发：改动 mobile/ 目录后 push，或在 Actions 页手动 Run workflow。
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon / splash (if logo provided)
        run: |
          if [ -f assets/logo.png ]; then
            echo "found assets/logo.png → 生成图标/启动图"
            npx @capacitor/assets generate --android \
              --iconBackgroundColor '#2f4a3e' \
              --iconBackgroundColorDark '#2f4a3e' \
              --splashBackgroundColor '#2f4a3e' \
              --splashBackgroundColorDark '#0e1626'
          else
            echo "无 assets/logo.png，沿用默认图标"
          fi

      - name: Sync web assets
        run: npx cap sync android

      # 固定签名密钥：APK 的签名必须【每次构建都一样】，否则新版装不到旧版上面
      # （Android 会报「应用未安装」），朋友们每次更新都得先卸载。
      # runner 上默认没有 ~/.android/debug.keystore，Gradle 会现生成一个 → 每次签名都不同。
      # 这里把仓库 Secret 里那份固定的还原到默认位置，assembleDebug 就会用它。
      # ⚠️ Secret 没配时不报错，只警告并沿用随机签名 —— 别让构建直接挂掉。
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "✅ 已使用仓库固定签名密钥（新版可直接覆盖安装）"
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null               | grep -m1 "SHA256:" || true
          else
            echo "⚠️ 未配置 ANDROID_KEYSTORE_B64 —— 本次用随机签名，安装新版前需要先卸载旧版"
          fi

      # 版本号写进 APK：versionName 取 mobile/package.json，versionCode 用构建序号（必须单调递增）
      - name: Stamp version into APK
        run: |
          VN=$(node -p "require('./package.json').version")
          VC=${{ github.run_number }}
          sed -i "s/versionCode .*/versionCode $VC/; s/versionName \".*\"/versionName \"$VN\"/" android/app/build.gradle
          echo "versionName=$VN  versionCode=$VC"
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pokerdojo.apk

      # 自证：光看「构建成功」根本看不出签名有没有换成固定的那把（没配 Secret 时也一样成功）。
      # 这里把 APK 的真实签名指纹打出来，并且——【配了 Secret 却没生效就直接失败】，
      # 否则会出现「界面全绿、实际还是随机签名」的静默错误。
      - name: Verify APK signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          # 固定签名密钥的 SHA256 指纹（公开信息，非机密——它印在每个已分发的 APK 里）。
          # 【按指纹判定，不要按 Owner 名】：固定 debug 密钥的 Owner 也是 CN=Android Debug，
          # 之前按 Owner 名比 → 只要配了 Secret 就永远误判成「随机签名」而硬失败（见 run #8）。
          EXPECT="19:ED:09:F6:08:85:F0:01:C2:DB:FE:3A:45:F0:CD:8E:E1:2C:C6:8E:1A:2B:B4:F3:C2:E6:7C:AD:3B:AD:38:81"
          OWNER=$(keytool -printcert -jarfile pokerdojo.apk 2>/dev/null | grep -m1 "Owner:")
          FP=$(keytool -printcert -jarfile pokerdojo.apk 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ' ')
          # 兜底：若 APK 只有 v2/v3 签名、keytool -jarfile 读不到 v1 → 用 apksigner
          if [ -z "$FP" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
            [ -n "$APKSIGNER" ] && FP=$("$APKSIGNER" verify --print-certs pokerdojo.apk 2>/dev/null \
              | grep -m1 -i "SHA-256 digest" | sed 's/.*: *//' | tr -d ' ' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          fi
          echo "$OWNER"
          echo "APK SHA256: $FP"
          # 把指纹写进运行的 Summary 页（不用翻日志就能看到）
          {
            echo "### APK 签名验签"
            echo ""
            echo "- APK 实际指纹：\`${FP:-<空：没读到签名>}\`"
            echo "- 期望（本地备份密钥）：\`$EXPECT\`"
            if [ "$FP" = "$EXPECT" ]; then echo "- 结果：✅ 一致"; else echo "- 结果：❌ 不一致（Secret 里不是本地备份那把）"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$KEYSTORE_B64" ]; then
            if [ "$FP" = "$EXPECT" ]; then
              echo "✅ APK 指纹与固定密钥一致 —— 新版可直接覆盖安装"
            else
              echo "❌ 已配置 ANDROID_KEYSTORE_B64，但 APK 指纹与固定密钥不符 —— Secret 没生效！"
              echo "   期望: $EXPECT"
              echo "   实际: $FP"
              echo "   常见原因：Secret 名字拼错 / 内容里混入换行或空格 / 贴的不是 .b64 完整内容 / build.gradle 里另有 signingConfig"
              exit 1
            fi
          else
            echo "⚠️ 未配置 ANDROID_KEYSTORE_B64 —— 本次是随机签名，安装新版前需要先卸载旧版"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokerdojo-debug-apk
          path: mobile/pokerdojo.apk
          if-no-files-found: error

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 德扑道场 Android（最新）
          body: |
            德扑道场 Poker Dojo 安卓安装包（debug/未签名，可直接侧载）。
            下载 `pokerdojo.apk` → 手机允许「安装未知来源应用」→ 安装。
            打开即加载线上最新版 https://pokerdojo.space。
            构建号：${{ github.run_number }} · 提交：${{ github.sha }}
          prerelease: true
          files: mobile/pokerdojo.apk
